name: Keep Render awake

# Render's free web service sleeps after ~15 min without traffic, which then
# costs a 30-60s cold start on the next visit. This job pings the lightweight
# /api/health endpoint so the instance stays warm.
#
# Notes:
#  - Best effort. GitHub can delay scheduled runs under load, so an external
#    monitor (e.g. UptimeRobot at a 5 min interval) is more punctual.
#  - Actions minutes are unlimited on PUBLIC repos. On a private repo a 10 min
#    schedule exceeds the free monthly allowance - use an external monitor there.
#  - GitHub disables schedules after 60 days without repo activity.
#  - Override the target without editing this file: set a repo variable
#    KEEPALIVE_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.KEEPALIVE_URL || 'https://findbest-inx1.onrender.com' }}/api/health"
          echo "Pinging $url"
          curl -sS --fail --location \
            --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            "$url"
